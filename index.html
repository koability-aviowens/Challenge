<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Challenge: 50 Questions</title>
<style>
:root{--bg:#f4f8ef;--card:#fff;--tx:#14301a;--ac:#1f8a3b;--ac2:#e8f5e9;--bad:#c62828;--bad2:#fdecea;--bd:#b7d3b9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c12;--card:#17281b;--tx:#eef7ee;--ac:#4cc46a;--ac2:#1d3a24;--bad:#ff8a80;--bad2:#3a1d1b;--bd:#2f4d35}}
:root[data-theme="dark"]{--bg:#0f1c12;--card:#17281b;--tx:#eef7ee;--ac:#4cc46a;--ac2:#1d3a24;--bad:#ff8a80;--bad2:#3a1d1b;--bd:#2f4d35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:700;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:20px;padding:22px}
h1{font-size:2rem;margin:0 0 10px}
p{font-size:1.2rem;line-height:1.5;margin:8px 0}
.top{display:flex;justify-content:space-between;font-size:1.1rem;margin-bottom:8px}
.bar{height:14px;background:var(--ac2);border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.q{font-size:1.6rem;line-height:1.35;margin:0 0 18px}
.o{display:block;width:100%;text-align:left;font:inherit;font-size:1.3rem;padding:16px;margin:10px 0;border:3px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o.ok{background:var(--ac2);border-color:var(--ac)}
.o.no{background:var(--bad2);border-color:var(--bad)}
.btn{font:inherit;font-size:1.3rem;padding:14px 28px;border:0;border-radius:14px;background:var(--ac);color:#fff;cursor:pointer;margin-top:12px}
.fb{font-size:1.2rem;min-height:1.6em;margin-top:6px}
.big{font-size:3.2rem;margin:6px 0}
</style></head><body><main><div class="card" id="app"></div></main>
<script>
const D=[
"A place where plants and animals live is called a ___.|Habitat|Adaptation|Food chain|Pollination",
"The two main types of habitat are ___.|Terrestrial and aquatic|Desert and forest|Marine and freshwater|Biotic and abiotic",
"Habitats found on land are called ___ habitats.|Terrestrial|Aquatic|Marine|Freshwater",
"Habitats found in water are called ___ habitats.|Aquatic|Terrestrial|Desert|Coastal",
"Which of these is a terrestrial habitat?|Desert|Ocean|Lake|River",
"Which of these is an aquatic habitat?|Pond|Grassland|Forest|Mountain",
"The two types of aquatic habitat are ___.|Marine and freshwater|Desert and forest|Land and air|Coastal and mountain",
"Which of these is a freshwater habitat?|River|Ocean|Sea|Marine",
"Living things in a habitat are called ___ components.|Biotic|Abiotic|Terrestrial|Aquatic",
"Non-living things in a habitat are called ___ components.|Abiotic|Biotic|Producers|Consumers",
"Which of these is abiotic?|Sunlight|Bacteria|Grass|Shark",
"Which of these is biotic?|Micro-organisms|Soil|Air|Temperature",
"Plants and animals depend on their habitat for ___.|Food, water, air and shelter|Only money|Only food|Only light",
"A camel lives in the ___ habitat.|Desert|Marine|Freshwater|Forest",
"A shark lives in the ___ habitat.|Marine|Desert|Grassland|Mountain",
"A coconut tree grows in the ___ habitat.|Coastal|Desert|Marine|Mountain",
"Adaptation is the way a living thing looks or behaves to ___ in its habitat.|Survive|Sleep|Travel|Play",
"The two types of adaptation are ___.|Structural and behavioural|Biotic and abiotic|Producer and consumer|Marine and freshwater",
"An adaptation that is a body part is ___.|Structural|Behavioural|Abiotic|Terrestrial",
"An adaptation that is an action or behaviour is ___.|Behavioural|Structural|Biotic|Aquatic",
"A camel's hump is used to store ___.|Fat|Sand|Milk|Grass",
"Long legs help a camel to ___.|Walk in the desert|Swim|Climb trees|Fly",
"Sharp claws and teeth help a tiger to ___.|Catch prey|Store water|Make food|Float",
"Spines on a cactus ___.|Protect it from animals|Make food|Attract bees|Float it",
"The fleshy stem of a cactus is used to ___.|Store water|Catch prey|Swim|Keep warm",
"A waxy stem in desert plants ___.|Prevents loss of water|Attracts rain|Helps swimming|Catches insects",
"Long roots in desert plants ___.|Absorb water from deep soil|Help them fly|Protect from animals|Keep them warm",
"Thick fur helps animals in cold places to ___.|Keep warm|Swim fast|Store water|Fly",
"Hollow bones help a bird to ___.|Fly|Swim|Dig|Run",
"A fish has a streamlined body so it can ___.|Swim easily|Fly|Dig|Climb",
"Aquatic plants have hollow stems to help them ___.|Float|Fly|Dig|Hide",
"Interdependence is when plants and animals ___ each other.|Depend on|Fight|Ignore|Eat only",
"Plants give animals oxygen and food. Animals give plants ___.|Carbon dioxide|Sunlight|Soil|Rain",
"A bee and a flower is an example of ___.|Mutualism|Parasitism|Commensalism|Predation",
"In mutualism, ___.|Both species benefit|One is harmed|Neither benefits|One is not affected",
"In commensalism, one organism benefits and the other is ___.|Not affected|Harmed|Killed|Helped",
"In parasitism, one benefits and the other is ___.|Harmed|Helped|Not affected|Fed",
"Lichen is made of a fungus living together with ___.|Algae|Moss|Bacteria|A fern",
"Pollination is the transfer of pollen from the ___ to the stigma.|Anther|Root|Stem|Leaf",
"Pollen can be carried by ___.|Bees and wind|Soil|Sand|Stones",
"A food chain shows the flow of ___.|Energy|Money|Water|Air",
"A food web is an interconnection of ___.|Food chains|Habitats|Seeds|Roots",
"Producers make their own food by ___.|Photosynthesis|Hunting|Digestion|Decay",
"The main source of energy for a food chain is the ___.|Sun|Moon|Soil|Wind",
"Grass is a ___.|Producer|Primary consumer|Secondary consumer|Decomposer",
"A goat is a ___.|Primary consumer|Producer|Decomposer|Top carnivore",
"Primary consumers are ___.|Herbivores|Carnivores|Decomposers|Producers",
"Bacteria and fungi are ___.|Decomposers|Producers|Herbivores|Consumers",
"Decomposers help to return ___ to the soil.|Nutrients|Sunlight|Water only|Oxygen",
"If one organism is removed from a food chain, the chain will be ___.|Disrupted|Stronger|Longer|Unchanged"
];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById("app");
let Q,i,score,streak,best,missed;
function start(){app.innerHTML=`<h1>🌿 Science Challenge</h1><p>50 questions on Habitat, Adaptation, Interdependence and Food Chains.</p><p>Choose the best answer. Build a streak!</p><button class="btn" onclick="go()">Start Game</button>`}
function go(){Q=sh(D);i=0;score=0;streak=0;best=0;missed=[];show()}
function show(){
const [q,...o]=Q[i].split("|"),c=o[0],opts=sh(o);
app.innerHTML=`<div class="top"><span>Question ${i+1} / 50</span><span>⭐ ${score} &nbsp; 🔥 ${streak}</span></div><div class="bar"><i style="width:${i/50*100}%"></i></div><p class="q">${q}</p><div id="opts"></div><p class="fb" id="fb"></p><div id="nx"></div>`;
const box=document.getElementById("opts");
opts.forEach(t=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(b,t,c);box.appendChild(b)})}
function pick(b,t,c){
document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent===c)x.classList.add("ok")});
const fb=document.getElementById("fb");
if(t===c){score++;streak++;best=Math.max(best,streak);fb.textContent=streak>=3?"✅ Correct! 🔥 "+streak+" in a row!":"✅ Correct!"}
else{streak=0;b.classList.add("no");missed.push(Q[i].split("|")[0]+" → "+c);fb.textContent="❌ The answer is: "+c}
document.getElementById("nx").innerHTML=`<button class="btn" onclick="next()">${i<49?"Next ➜":"See Results"}</button>`}
function next(){i++;i<50?show():end()}
function end(){
const m=score>=45?"🏆 Science Champion!":score>=35?"🌟 Excellent work!":score>=25?"👍 Good job, keep going!":"📚 Keep studying, try again!";
app.innerHTML=`<h1>Game Over</h1><div class="big">${score} / 50</div><p>${m}</p><p>Best streak: 🔥 ${best}</p>${missed.length?`<p>Review these:</p><div style="font-size:1.05rem;line-height:1.5">${missed.map(x=>"• "+x).join("<br>")}</div>`:""}<button class="btn" onclick="go()">Play Again</button>`}
start();
</script></body></html>
